  <body>
    <div class="fg-bg">

          <a href="https://omplay.com.br/planos/" target="_blank" style="position:absolute;display:block;cursor:pointer;top:48.9%;height:2.0%;left:27%;width:46%"></a>
          <a href="https://omplay.com.br/checkout/?plan=anual-basico" target="_blank" style="position:absolute;display:block;cursor:pointer;top:59.3%;height:2.0%;left:4%;width:43%"></a>

      </div>
    </div>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        background-color: #e5e5e7;
        background-image: url('https://lucasoliveira1983.github.io/omplay-pages/background.png');
        background-size: 100% auto;
        background-repeat: repeat-y;
        background-position: top center;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        margin: 0;
        padding: 0;
      }
      .fg-bg {
        background-color: #e5e5e7;
        background-image: url('https://lucasoliveira1983.github.io/omplay-pages/background.png');
        background-size: 100% auto;
        background-repeat: repeat-y;
        background-position: top center;
        min-height: 100vh;
        display: flex;
        justify-content: center;
      }
      .fg-page {
        width: 100%;
        max-width: 480px;
        background-image: url('https://lucasoliveira1983.github.io/omplay-pages/background.png');
        background-size: 100% auto;
        background-repeat: no-repeat;
        background-position: top center;
      }
      .fg-wrap {
        position: relative;
        width: 100%;
        display: block;
      }
      .fg-wrap img {
        display: block;
        width: 100%;
        height: auto;
      }
      @media (min-width: 600px)  { .fg-page { max-width: 580px; } }
      @media (min-width: 1024px) { body, .fg-bg { background-size: 50% auto; } .fg-page { max-width: 860px; } }
      @media (min-width: 1440px) { body, .fg-bg { background-size: 40% auto; } .fg-page { max-width: 960px; } }
    </style>
  </body>
</html>
