<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fórum Digital — Assine Agora</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background-color: #e5e5e7;
  background-image: url('https://lucasoliveira1983.github.io/omplay-pages/background.png');
  background-size: 100% auto;
  background-repeat: repeat-y;
  background-position: top center;
  min-height: 100vh;
  display: flex;
  justify-content: center;
}

.page {
  width: 100%;
  max-width: 480px;
}

/* Tablet */
@media (min-width: 600px) {
  .page { max-width: 580px; }
}

/* Desktop */
@media (min-width: 1024px) {
  body {
    background-size: 50% auto;
    background-position: center top;
  }
  .page { max-width: 860px; }
}

/* Wide desktop */
@media (min-width: 1440px) {
  body { background-size: 40% auto; }
  .page { max-width: 960px; }
}

.design-wrap {
  position: relative;
  width: 100%;
  display: block;
}

.design-wrap img {
  display: block;
  width: 100%;
  height: auto;
  user-select: none;
  -webkit-user-drag: none;
}

/* ── HOTSPOTS ──────────────────────────────────────────────
   % relativas à altura total da imagem do design.
   Para calibrar, descomente: background: rgba(255,0,0,.35)
──────────────────────────────────────────────────────────── */
.hs {
  position: absolute;
  display: block;
  cursor: pointer;
  /* background: rgba(255, 0, 0, .35); */
}
</style>
</head>

<div class="page">
