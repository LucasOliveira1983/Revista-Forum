<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fórum Tarifa Zero</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: 'Montserrat', system-ui, Arial, sans-serif;
      background: #0e1f55;
    }

    /* ── Imagens de seção ── */
    .section-img {
      display: block;
      width: 100%;
      height: auto;
    }

    /* ── Botão CTA ── */
    .cta-section {
      padding: 48px 20px 56px;
      background: linear-gradient(180deg, #111733 0%, #0f1530 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
    }
    .cta-btn {
      display: inline-block;
      padding: 22px 64px;
      background: radial-gradient(circle at 35% 25%, #53cf58 0%, #43b449 58%, #2f8434 100%);
      color: #fff;
      font-family: 'Montserrat', system-ui, Arial, sans-serif;
      font-size: clamp(1rem, 2.8vw, 1.2rem);
      font-weight: 900;
      text-transform: uppercase;
      text-decoration: none;
      letter-spacing: 0.07em;
      border-radius: 999px;
      box-shadow: 0 18px 44px rgba(0, 0, 0, 0.36);
      transition: opacity 0.2s, transform 0.15s;
      text-align: center;
    }
    .cta-btn:hover  { opacity: 0.88; transform: translateY(-2px); }
    .cta-btn:active { opacity: 1;    transform: translateY(0); }

    /* ── Rodapé ── */
    .footer {
      background: #0f1530;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding: 36px 20px 52px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .footer-realizacao {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .footer-lbl {
      color: rgba(247, 248, 252, 0.5);
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }
    .footer-logo-pill {
      display: inline-flex;
      align-items: center;
      background: #fff;
      border-radius: 10px;
      padding: 5px 12px;
    }
    .footer-logo-pill img {
      height: 30px;
      width: auto;
      display: block;
    }
    .footer-apoio {
      margin: 0;
      color: rgba(247, 248, 252, 0.5);
      font-size: 0.88rem;
      font-weight: 600;
      text-align: center;
      line-height: 1.6;
    }

    /* ── Mobile (≤ 600px) ── */
    @media (max-width: 600px) {
      .cta-section { padding: 36px 16px 44px; }
      .cta-btn {
        padding: 18px 32px;
        width: 100%;
        max-width: 320px;
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>

  <!-- ① Hero -->
  <img
    src="https://raw.githubusercontent.com/LucasOliveira1983/omplay-pages/main/ftzo-hero.png"
    alt="Fórum Tarifa Zero — 17 de junho de 2026 — Teatro dos Bancários, Brasília/DF"
    class="section-img"
  >

  <!-- ② CTA — inscrição -->
  <section class="cta-section">
    <a href="https://mautic.revistaforum.com.br/page/preview/17" class="cta-btn">
      Inscrever-se Agora
    </a>
  </section>

  <!-- ③ Formulário / inscrição visual -->
  <img
    src="https://raw.githubusercontent.com/LucasOliveira1983/omplay-pages/main/ftzo-form.png"
    alt=""
    class="section-img"
  >

  <!-- ④ Argumentos -->
  <img
    src="https://raw.githubusercontent.com/LucasOliveira1983/omplay-pages/main/ftzo-arguments.png"
    alt=""
    class="section-img"
  >

  <!-- ⑤ Rodapé -->
  <footer class="footer">
    <div class="footer-realizacao">
      <span class="footer-lbl">Realização</span>
      <span class="footer-logo-pill">
        <img
          src="https://raw.githubusercontent.com/LucasOliveira1983/omplay-pages/main/ftzo-logo-forum.png"
          alt="Revista Fórum"
        >
      </span>
    </div>
    <p class="footer-apoio">Apoio: Sindicato dos Bancários do Distrito Federal.</p>
  </footer>

</body>
</html>
