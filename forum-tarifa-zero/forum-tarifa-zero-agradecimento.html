<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fórum Tarifa Zero — Inscrição confirmada</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Montserrat', system-ui, Arial, sans-serif;
      background: #0e1f55;
    }
    .section-img {
      display: block;
      width: 100%;
      height: auto;
    }
    .footer {
      background: #0f1530;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding: 36px 20px 52px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .footer-realizacao {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .footer-lbl {
      color: rgba(247, 248, 252, 0.5);
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }
    .footer-logo-pill {
      display: inline-flex;
      align-items: center;
    }
    .footer-logo-pill img {
      height: 44px;
      width: auto;
      display: block;
    }
    .footer-apoio {
      margin: 0;
      color: rgba(247, 248, 252, 0.5);
      font-size: 0.88rem;
      font-weight: 600;
      text-align: center;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <!-- Página de agradecimento -->
  <img
    src="https://raw.githubusercontent.com/LucasOliveira1983/omplay-pages/main/forum-tarifa-zero/ftzo-thankyou.png"
    alt="Inscrição confirmada — Fórum Tarifa Zero"
    class="section-img"
  >

  <!-- Rodapé -->
  <footer class="footer">
    <div class="footer-realizacao">
      <span class="footer-lbl">Realização:</span>
      <span class="footer-logo-pill">
        <img
          src="https://raw.githubusercontent.com/LucasOliveira1983/omplay-pages/main/forum-tarifa-zero/ftzo-logo-forum-transparent.png"
          alt="Revista Fórum"
        >
      </span>
    </div>
    <p class="footer-apoio">Apoio: Sindicato dos Bancários do Distrito Federal.</p>
  </footer>

</body>
</html>
